model:
  base_learning_rate: 1.0e-06
  target: lidm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0205
    num_timesteps_cond: 1
    log_every_t: 100
    timesteps: 1000
    image_size: [16, 128]
    channels: 8
    monitor: val/loss_simple_ema
    first_stage_key: image
    cond_stage_key: segmentation
    concat_mode: true
    cond_stage_trainable: true
    verbose: false
    unet_config:
      target: lidm.modules.diffusion.openaimodel.UNetModel
      params:
        image_size: [16, 128]
        in_channels: 16
        out_channels: 8
        model_channels: 256
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4]
        num_head_channels: 32
        lib_name: lidm
    first_stage_config:
      target: lidm.models.autoencoder.VQModelInterface
      params:
        embed_dim: 8
        n_embed: 16384
        lib_name: lidm
        use_mask: False  # False
        ckpt_path: logs/nuscenes/2025-02-24T03-03-29_autoencoder_c2_p4_wo_ls/config_w_weights/model.ckpt
        ddconfig:
          double_z: false
          z_channels: 8
          in_channels: 1
          out_ch: 1
          ch: 64
          ch_mult: [1,2,2,4]
          strides: [[1,2],[2,2],[2,2]]
          num_res_blocks: 2
          attn_levels: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: lidm.modules.encoders.modules.SpatialRescaler
      params:
        strides: [[1,2],[2,2],[2,2]]
        in_channels: 17
        out_channels: 8

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    wrap: true
    dataset:
      size: [64, 1024] # [32, 1024], we doubled the number of rows to match original training dynamics
      fov: [ 10.67, -30.67 ]
      depth_range: [ 1.0,56.0 ]
      depth_scale: 56  # np.log2(depth_max + 1)
      log_scale: false
      x_range: [ -50.0, 50.0 ]
      y_range: [ -50.0, 50.0 ]
      z_range: [ -3.0, 1.0 ]
      resolution: 1
      num_channels: 1
      num_cats: 10
      num_views: 2
      num_sem_cats: 16
      filtered_map_cats: [ ]
      double_num_lasers_to_64: true
      double_seg_only: true
    aug:
      flip: true
      rotate: true
      keypoint_drop: false
      keypoint_drop_range: [ 5,20 ]
      randaug: false
    train:
      target: lidm.data.nuscenes.NUSCENESTrain
      params:
        condition_key: segmentation
    validation:
      target: lidm.data.nuscenes.NUSCENESValidation
      params:
        condition_key: segmentation


lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 5000
        max_images: 8
        increase_log_steps: False

  trainer:
    # LiDM author's budget for LiDMs (DESIGN.md: "trained with 10k steps").
    # Without this PyTorch-Lightning falls back to max_epochs=1000, which is
    # ~1.2M steps on SemanticKITTI - i.e. it never stops on its own.
    max_steps: 10000
    benchmark: true
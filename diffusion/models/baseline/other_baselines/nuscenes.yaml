data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    wrap: true
    dataset:
      size:
      - 64
      - 1024
      fov:
      - 10.67
      - -30.67
      depth_range:
      - 1.0
      - 56.0
      depth_scale: 56
      log_scale: false
      x_range:
      - -50.0
      - 50.0
      y_range:
      - -50.0
      - 50.0
      z_range:
      - -3.0
      - 1.0
      resolution: 1
      num_channels: 1
      num_cats: 10
      num_views: 2
      num_sem_cats: 16
      filtered_map_cats: []
      double_num_lasers_to_64: true
      double_seg_only: true
    aug:
      flip: true
      rotate: true
      keypoint_drop: false
      keypoint_drop_range:
      - 5
      - 20
      randaug: false
    train:
      target: lidm.data.nuscenes.NUSCENESTrain
      params:
        condition_key: segmentation
    validation:
      target: lidm.data.nuscenes.NUSCENESValidation
      params:
        condition_key: segmentation



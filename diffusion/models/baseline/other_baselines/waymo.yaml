data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    wrap: true
    dataset:
      size:
      - 64
      - 1024
      fov:
      - 2.2425447
      - -17.660652
      align_to_kitti: true
      depth_range:
      - 1.0
      - 56.0
      depth_scale: 56
      log_scale: false
      x_range:
      - -50.0
      - 50.0
      y_range:
      - -50.0
      - 50.0
      z_range:
      - -3.0
      - 1.0
      resolution: 1
      num_channels: 1
      num_cats: 10
      num_views: 2
      num_sem_cats: 19
      filtered_map_cats: []
    aug:
      flip: true
      rotate: false
      keypoint_drop: false
      keypoint_drop_range:
      - 5
      - 20
      randaug: false
    train:
      target: lidm.data.waymo.WODTrain
      params:
        condition_key: segmentation
    validation:
      target: lidm.data.waymo.WODValidation
      params:
        condition_key: segmentation

